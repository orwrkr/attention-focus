name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The license notices are generated offline, so every Windows package must be present.
      - name: Download the dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Check the embedded license notices
        run: python ./scripts/release_tools.py check-notices
      - name: Test packaging tools
        run: python ./scripts/test_release_tools.py
      - name: Test release output rules
        shell: pwsh
        run: ./scripts/test-release-output.ps1
