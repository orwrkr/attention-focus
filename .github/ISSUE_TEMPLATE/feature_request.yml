name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, before any particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        This application stays local and records only time you declare. Cloud services,
        telemetry, window monitoring and productivity scoring are outside its scope.
