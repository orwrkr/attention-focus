# Version updates for the three kinds of dependencies; see ADR-0041. Security updates are turned on in
# the repository settings and are not limited by this schedule.
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust crates. A changed Cargo.lock also changes the embedded license notices, so such a pull request
  # fails CI until the notices are regenerated locally with scripts/build.ps1.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # The tools that export the user guide PDF.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      docs-tools-minor-and-patch:
        update-types: ["minor", "patch"]

  # Workflow actions, which stay pinned by commit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
